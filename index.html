<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Aria2 Download</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #111827; color: #e5e7eb; padding: 16px; }
    .wrap { max-width: 700px; margin: 0 auto; }
    h1 { font-size: 20px; margin-bottom: 16px; }
    .card { background: #1f2937; border: 1px solid #374151; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
    label { display: block; font-size: 14px; color: #9ca3af; margin-bottom: 6px; }
    input, textarea { width: 100%; padding: 12px; background: #111827; border: 1px solid #374151; border-radius: 8px; color: #e5e7eb; font-size: 15px; }
    textarea { min-height: 72px; resize: vertical; }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    button { flex: 1; background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 600; }
    button:hover { background: #2563eb; }
    .status { margin-top: 12px; padding: 10px; border-radius: 8px; display: none; line-height: 1.4; }
    .success { background: #065f46; color: #d1fae5; display: block; }
    .error { background: #7f1d1d; color: #fecaca; display: block; }
    .info { background: #1e3a5f; color: #bfdbfe; display: block; }
    .tabs { display: flex; gap: 0; margin-bottom: 0; background: #1f2937; border-radius: 14px 14px 0 0; overflow: hidden; border: 1px solid #374151; border-bottom: none; }
    .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-size: 13px; background: #111827; color: #6b7280; }
    .tab.active { background: #1f2937; color: #e5e7eb; font-weight: 600; }
    .tab:hover { background: #374151; }
    .task { padding: 12px 0; border-bottom: 1px solid #374151; font-size: 14px; line-height: 1.5;}
    .task:last-child { border-bottom: none; }
    .task-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .task-name { flex: 1; word-break: break-all; color: #e5e7eb; }
    .task-meta { font-size: 12px; color: #9ca3af; margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
    .task-actions-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
    .task-url-wrap { flex: 0 0 auto; margin-right: auto; }
    .task-url-label, .task-url-text { display: none; }
    .task-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .task-actions button, .task-url-wrap button { flex: 0 0 auto; padding: 8px 18px; font-size: 14px; border-radius: 8px; border: none; background: #3b82f6; color: #fff; cursor: pointer; font-weight: 600; min-width: 64px; text-align: center; white-space: nowrap; height: 40px; box-sizing: border-box; }
    .task-actions button:hover, .task-url-wrap button:hover { background: #2563eb; }
    .task-url-wrap button.copy, .task-actions button.copy { background: #22c55e; }
    .task-url-wrap button.copy:hover, .task-actions button.copy:hover { background: #16a34a; }
    .task-actions button.delete { background: #ef4444; }
    .task-actions button.delete:hover { background: #dc2626; }
    .task-actions button.resume { background: #22c55e; }
    .task-actions button.resume:hover { background: #16a34a; }
    .progress-wrap { background: #374151; height: 4px; border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .progress-bar { height: 100%; background: #3b82f6; border-radius: 2px; transition: width 1s; }
    .progress-bar.seeding { background: #22c55e; }
    .global-speed { text-align: center; font-size: 13px; color: #9ca3af; padding: 4px 0; }
    .history { margin-top: 12px; border-top: 1px solid #374151; padding-top: 12px; }
    .history-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .history-title { font-size: 13px; color: #9ca3af; margin-bottom: 0; }
    .history-toggle { font-size: 20px; color: #9ca3af; line-height: 1; }
    .history-body { display: none; margin-top: 8px; }
    .history-body.open { display: block; }
    .history-item { font-size: 12px; color: #93c5fd; padding: 6px 0; border-bottom: 1px dashed #374151; word-break: break-all; cursor: pointer; }
    .history-item:last-child { border-bottom: none; }
    .task-dir { font-size: 12px; color: #93c5fd; margin-top: 4px; overflow: hidden; }
    .task-dir-link { color: #93c5fd; text-decoration: none; display: inline-block; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
    .task-dir-link:hover { text-decoration: underline; }
    .empty { color: #6b7280; text-align: center; padding: 24px 0; font-size: 14px; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>⬇ Aria2</h1>

  <div class="card" style="padding:16px">
    <label style="font-size:16px;color:#e5e7eb;font-weight:700;margin-bottom:10px;">添加任务</label>
    <textarea id="url" placeholder="magnet:?xt=urn:btih:... 或 https://example.com/file.iso"></textarea>
    <div style="height:10px"></div>
    <label>分类</label>
    <select id="category" style="width:100%;padding:12px;background:#111827;border:1px solid #374151;border-radius:8px;color:#e5e7eb;font-size:15px;">
      <option value="movies">电影</option>
      <option value="tv">剧集</option>
      <option value="music">音乐</option>
      <option value="software">软件</option>
      <option value="books">书籍</option>
      <option value="other" selected>其他</option>
    </select>
    <div class="btn-row">
      <button onclick="addTask()">添加下载</button>
    </div>
    <div id="status" class="status"></div>
    <div id="globalSpeed" class="global-speed"></div>
    <div class="history">
      <div class="history-header" onclick="toggleHistory()">
        <div class="history-title">最近添加</div>
        <div id="historyToggle" class="history-toggle">▸</div>
      </div>
      <div id="historyBody" class="history-body">
        <div id="historyList"><div class="empty" style="padding:8px 0">暂无记录</div></div>
      </div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" onclick="switchTab('active')">下载中</div>
    <div class="tab" onclick="switchTab('waiting')">等待中</div>
    <div class="tab" onclick="switchTab('stopped')">已完成</div>
  </div>
  <div class="card" style="border-radius:0 0 14px 14px;margin-top:0;border-top:none">
    <div id="taskList"><div class="empty">加载中…</div></div>
  </div>
</div>

<script>
const RPC_URL = '/jsonrpc';
const RPC_SECRET = 'aS9zdiPJ8xIhCSeBWC3J';
let currentTab = 'active';

async function rpc(method, params) {
  const r = await fetch(RPC_URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({jsonrpc: '2.0', id: Date.now(), method, params: ['token:' + RPC_SECRET].concat(params)})
  });
  const j = await r.json();
  return j;
}

function show(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab:nth-child(' + ({active:1,waiting:2,stopped:3}[tab]) + ')').classList.add('active');
  loadTasks();
}

async function loadTasks() {
  const el = document.getElementById('taskList');
  let tasks;
  if (currentTab === 'active') {
    const r = await rpc('aria2.tellActive', []);
    if (r.error) { el.innerHTML = '<div class="empty">无法连接 Aria2</div>'; return; }
    tasks = r.result || [];
  } else if (currentTab === 'waiting') {
    const r = await rpc('aria2.tellWaiting', [0, 100]);
    if (r.error) { el.innerHTML = '<div class="empty">无法连接 Aria2</div>'; return; }
    tasks = r.result || [];
  } else {
    const r = await rpc('aria2.tellStopped', [0, 100]);
    if (r.error) { el.innerHTML = '<div class="empty">无法连接 Aria2</div>'; return; }
    tasks = r.result || [];
  }

  if (tasks.length === 0) {
    el.innerHTML = '<div class="empty">暂无任务</div>';
    return;
  }

  el.innerHTML = tasks.map(t => {
    const name = t.bittorrent && t.bittorrent.info ? t.bittorrent.info.name : (t.files[0] ? t.files[0].path.split('/').pop() : t.gid);
    const total = parseInt(t.totalLength) || 0;
    const completed = parseInt(t.completedLength) || 0;
    const pct = total > 0 ? (completed / total * 100).toFixed(1) : 0;
    const downSpd = parseInt(t.downloadSpeed) || 0;
    const upSpd = parseInt(t.uploadSpeed) || 0;
    const seeders = parseInt(t.numSeeders) || 0;
    const peers = parseInt(t.connections) || 0;
    const status = t.status;
    const isSeeding = status === 'seeding';
    const sizeStr = total > 0 ? (total / 1024 / 1024).toFixed(1) + ' MB' : '?';
    const doneStr = completed > 0 ? (completed / 1024 / 1024).toFixed(1) + ' MB' : '0';
    const speedStr = (downSpd > 0 ? '⬇ ' + (downSpd/1024/1024).toFixed(1) + ' MB/s' : '') + (upSpd > 0 ? ' ⬆ ' + (upSpd/1024/1024).toFixed(1) + ' MB/s' : '');
    const seedPeer = status === 'active' ? (seeders > 0 ? '做种:' + seeders : '') + (peers > 0 ? ' 连接:' + peers : '') : '';
    const dirPath = (t.files && t.files[0] && t.files[0].path) ? t.files[0].path.split('/').slice(0,-1).join('/') : '';
    const dirName = dirPath ? dirPath.split('/').pop() : '';

    return '<div class="task">'
      + '<div class="task-header"><span class="task-name">' + esc(name) + '</span></div>'
      + '<div class="task-meta">'
      + (status === 'active' ? doneStr + ' / ' + sizeStr + ' (' + pct + '%)' : status === 'waiting' ? '等待中' : status === 'paused' ? '已暂停' : doneStr + ' / ' + sizeStr)
      + (speedStr ? ' • ' + speedStr : '')
      + (seedPeer ? ' • ' + seedPeer : '')
      + '</div>'
      + (dirName ? '<div class="task-dir">目录：<a class="task-dir-link" href="https://files.degietu.eu.org" target="_blank">' + esc(dirName) + '</a></div>' : '')
      + (status === 'active' || status === 'paused' ? '<div class="progress-wrap"><div class="progress-bar' + (isSeeding ? ' seeding' : '') + '" style="width:' + pct + '%"></div></div>' : '')
      + (status === 'active' || status === 'paused' || status === 'waiting' ? '<div class="task-actions-row">' +
        '<div class="task-url-wrap"><button class="copy" onclick="copyUrl(' + "'" + t.gid + "'" + ')">复制链接</button></div>' +
        '<div class="task-actions">' +
        (status === 'active' ? '<button class="pause" onclick="pauseTask(' + "'" + t.gid + "'" + ')">暂停</button>' : '<button class="resume" onclick="unpauseTask(' + "'" + t.gid + "'" + ')">继续</button>') +
        '<button class="delete" onclick="delTask(' + "'" + t.gid + "'" + ')">删除</button></div></div>' : '')
      + '</div>';
  }).join('');
}

function getHistory() {
  try { return JSON.parse(localStorage.getItem('aria2_history') || '[]'); } catch(e) { return []; }
}
function saveHistory(list) {
  localStorage.setItem('aria2_history', JSON.stringify(list.slice(0,10)));
}
function toggleHistory() {
  const body = document.getElementById('historyBody');
  const icon = document.getElementById('historyToggle');
  if (!body || !icon) return;
  const isOpen = body.classList.toggle('open');
  icon.textContent = isOpen ? '▾' : '▸';
}
function renderHistory() {
  const el = document.getElementById('historyList');
  if (!el) return;
  const list = getHistory();
  if (!list.length) { el.innerHTML = '<div class="empty" style="padding:8px 0">暂无记录</div>'; return; }
  el.innerHTML = list.map((x,i) => '<div class="history-item" onclick="reuseHistory(' + i + ')">' + esc(x.url) + ' <span style="color:#6b7280">[' + esc(x.category) + ']</span></div>').join('');
}
function reuseHistory(i) {
  const list = getHistory();
  if (!list[i]) return;
  document.getElementById('url').value = list[i].url;
  document.getElementById('category').value = list[i].category || 'other';
}
async function copyUrl(gid) {
  const r = await rpc('aria2.tellStatus', [gid]);
  if (r.result && r.result.files && r.result.files[0] && r.result.files[0].uris && r.result.files[0].uris[0]) {
    const url = r.result.files[0].uris[0].uri;
    try { await navigator.clipboard.writeText(url); show('已复制到剪贴板', 'success'); } catch(e) { show('复制失败: ' + e.message, 'error'); }
  } else { show('没有可复制的链接', 'info'); }
}

async function addTask() {
  const url = document.getElementById('url').value.trim();
  const category = document.getElementById('category').value;
  if (!url) { show('请输入链接', 'error'); return; }
  document.getElementById('url').disabled = true;
  const dirMap = {
    movies: '/downloads/movies',
    tv: '/downloads/tv',
    music: '/downloads/music',
    software: '/downloads/software',
    books: '/downloads/books',
    other: '/downloads/other'
  };
  const r = await rpc('aria2.addUri', [[url], {dir: dirMap[category] || '/downloads/other'}]);
  document.getElementById('url').disabled = false;
  if (r.error) { show('失败: ' + r.error.message, 'error'); return; }
  const hist = getHistory();
  hist.unshift({url: url, category: category, time: Date.now()});
  saveHistory(hist);
  renderHistory();
  document.getElementById('url').value = '';
  show('已添加下载任务（分类：' + category + '）', 'success');
  loadTasks();
}

async function pauseTask(gid) {
  await rpc('aria2.forcePause', [gid]);
  loadTasks();
}
async function unpauseTask(gid) {
  await rpc('aria2.unpause', [gid]);
  loadTasks();
}
async function delTask(gid) {
  await rpc('aria2.forceRemove', [gid]);
  loadTasks();
}

function esc(s) { return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

renderHistory();
renderHistory();
loadTasks();
setInterval(loadTasks, 3000);
</script>
</body>
</html>
